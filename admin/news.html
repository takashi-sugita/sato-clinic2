<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お知らせ管理｜佐藤医院</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content-section"><div class="container"><h1 class="content-title">お知らせ管理</h1><p>お知らせを追加・編集・削除できます（このブラウザに保存されます）。</p><form id="login-form"><h2>管理者ログイン</h2><p><label>ID <input id="login-id" required autocomplete="username"></label></p><p><label>パスワード <input id="login-pass" type="password" required autocomplete="current-password"></label></p><button class="btn" type="submit">ログイン</button><p id="login-error" aria-live="polite"></p></form><div id="admin-content" hidden><form id="news-form"><input type="hidden" id="edit-index"><p><label>日付 <input id="date" required placeholder="2025.12.01"></label></p><p><label>タイトル <input id="title" required></label></p><p><label>タグ <input id="tag" value="お知らせ" required></label></p><button class="btn" type="submit">保存</button></form><div id="news-admin-list"></div><p><button id="logout" type="button">ログアウト</button></p></div><p><a href="index.html">管理画面へ戻る</a></p></div></main><script src="../js/admin-news.js"></script></body></html>
