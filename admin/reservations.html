<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約管理｜佐藤医院</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content-section"><div class="container"><h1 class="content-title">予約管理</h1><table class="admin-reservation-table"><thead><tr><th>予約日</th><th>予約時間</th><th>区分</th><th>診療科目</th><th>診察券番号</th><th>お名前</th><th>フリガナ</th><th>電話番号</th><th>操作</th></tr></thead><tbody id="reservation-list"><tr><td colspan="9">予約はありません。</td></tr></tbody></table><p><a href="index.html">管理画面へ戻る</a></p></div></main><script>const k="satoClinicReservations";function draw(){const a=JSON.parse(localStorage.getItem(k)||"[]").sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));document.querySelector("#reservation-list").innerHTML=a.length?a.map(r=>`<tr><td>${r.date}</td><td>${r.time}</td><td>${r.type==="existing"?"再診":"初診"}</td><td>${r.department||""}</td><td>${r.cardNumber||""}</td><td>${r.name||""}</td><td>${r.kana||""}</td><td>${r.phone||""}</td><td><button class="reservation-cancel" type="button" data-id="${r.id}">キャンセル</button></td></tr>`).join(""):"<tr><td colspan=\"9\">予約はありません。</td></tr>";document.querySelectorAll(".reservation-cancel").forEach(b=>b.onclick=()=>{if(!confirm("この予約をキャンセルしますか？"))return;const id=Number(b.dataset.id);localStorage.setItem(k,JSON.stringify(JSON.parse(localStorage.getItem(k)||"[]").filter(r=>r.id!==id)));draw()})}draw();</script></body></html>
