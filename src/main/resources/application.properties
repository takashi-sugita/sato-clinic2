spring.application.name=sato-clinic2

# Local MySQL connection. Override these values with environment variables when needed.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sato_clinic}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:sato_app}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# This project currently serves static HTML files instead of Thymeleaf templates.
spring.thymeleaf.check-template-location=false
