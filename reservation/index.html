<section class="content-section reservation-page"><div class="container"><div class="prose reservation-lead"><p>ご希望の日時を選択してご予約ください。予防接種や健康診断などは、事前のご予約をお願いいたします。</p></div><form id="reservation-form" class="reservation-form"><label>患者区分<select id="patient-type" required><option value="new">初診</option><option value="existing">再診</option></select></label><label>診療科目<select id="department" required><option value="">選択してください</option><option>内科</option><option>循環器内科</option><option>呼吸器内科</option><option>予防接種・健康診断</option><option>生活習慣病</option></select></label><label id="card-number-field" hidden>診察券番号<input id="card-number"></label><label>お名前<input id="patient-name" required></label><label>電話番号<input id="patient-phone" required type="tel"></label><label>予約日<input id="reserve-date" required type="date"></label><label>予約時間<select id="reserve-time" required><option value="">選択してください</option><option>09:00〜10:00</option><option>10:00〜11:00</option><option>11:00〜12:00</option><option>13:00〜14:00</option><option>14:00〜15:00</option><option>15:00〜16:00</option><option>16:00〜17:00</option><option>17:00〜18:00</option></select></label><button class="btn" type="submit">予約を申し込む</button><p id="reservation-result" class="reservation-result"></p></form><h2 class="content-title reservation-status-title">予約状況</h2><div id="availability"></div></div></section></main>
